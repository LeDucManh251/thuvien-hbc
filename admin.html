<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Admin - Thư Viện HBC</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
<style>
  :root {
    --primary:#1a56db; --primary-light:#e8f0fe;
    --success:#057a55; --success-light:#def7ec;
    --danger:#c81e1e; --danger-light:#fde8e8;
    --warning:#92400e; --warning-light:#fef3c7;
    --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb;
    --gray-500:#6b7280; --gray-700:#374151; --gray-900:#111827;
    --radius:12px;
  }
  * { box-sizing:border-box; }
  body { background:var(--gray-50); font-family:'Segoe UI',system-ui,sans-serif; padding-bottom:80px; }
  .page-wrap { max-width:600px; margin:0 auto; }

  /* LOGIN */
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--gray-50); }
  .login-card { background:#fff; border-radius:16px; padding:28px 24px; width:100%; max-width:380px; border:1px solid var(--gray-200); box-shadow:0 4px 16px rgba(0,0,0,.07); }
  .login-logo { font-size:36px; text-align:center; margin-bottom:8px; }
  .login-title { font-size:20px; font-weight:700; text-align:center; margin-bottom:4px; }
  .login-sub { font-size:13px; color:var(--gray-500); text-align:center; margin-bottom:20px; }
  .form-label-sm { font-size:13px; font-weight:600; color:var(--gray-700); margin-bottom:5px; display:block; }
  .form-input { width:100%; border:1.5px solid var(--gray-200); border-radius:10px; padding:11px 14px; font-size:14px; outline:none; transition:border .2s; margin-bottom:12px; }
  .form-input:focus { border-color:var(--primary); }
  .btn-login { width:100%; background:var(--primary); color:#fff; border:none; border-radius:10px; padding:13px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-login:hover { background:#1648c8; }
  .alert-error { background:var(--danger-light); color:var(--danger); border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:12px; }

  /* TOPBAR */
  .topbar { background:#fff; border-bottom:1px solid var(--gray-200); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
  .topbar-title { font-size:16px; font-weight:700; }
  .btn-logout { font-size:13px; color:var(--danger); background:none; border:none; cursor:pointer; font-weight:600; }

  /* STATS */
  .stats-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 12px 0; }
  .stat-card { background:#fff; border:1px solid var(--gray-200); border-radius:var(--radius); padding:14px; }
  .stat-label { font-size:12px; color:var(--gray-500); font-weight:500; margin-bottom:4px; }
  .stat-value { font-size:26px; font-weight:700; color:var(--gray-900); }

  /* SECTION */
  .section-title { font-size:14px; font-weight:700; color:var(--gray-700); padding:16px 16px 8px; border-bottom:1px solid var(--gray-200); background:#fff; margin-top:12px; }

  /* BORROW ROW */
  .borrow-row { background:#fff; border-bottom:1px solid var(--gray-100); padding:12px 16px; display:flex; gap:12px; align-items:flex-start; }
  .borrow-info { flex:1; }
  .borrow-book { font-size:14px; font-weight:600; color:var(--gray-900); margin-bottom:2px; }
  .borrow-person { font-size:12px; color:var(--gray-500); }
  .borrow-date { font-size:11px; color:var(--gray-500); margin-top:3px; }
  .status-pill { font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .status-borrowing { background:var(--danger-light); color:var(--danger); }
  .status-waiting { background:var(--warning-light); color:var(--warning); }
  .btn-confirm { background:var(--success); color:#fff; border:none; border-radius:8px; padding:7px 14px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; margin-top:4px; }

  /* REVIEW FORM */
  .review-form-wrap { background:#fff; padding:16px; }
  .form-select { width:100%; border:1.5px solid var(--gray-200); border-radius:10px; padding:10px 14px; font-size:14px; outline:none; margin-bottom:12px; background:#fff; }
  .form-textarea { width:100%; border:1.5px solid var(--gray-200); border-radius:10px; padding:10px 14px; font-size:14px; outline:none; resize:vertical; min-height:140px; line-height:1.6; font-family:inherit; }
  .form-textarea:focus, .form-select:focus { border-color:var(--primary); }
  .btn-submit { width:100%; background:var(--primary); color:#fff; border:none; border-radius:10px; padding:13px; font-size:15px; font-weight:700; cursor:pointer; margin-top:12px; }
  .btn-submit:disabled { background:var(--gray-200); color:var(--gray-500); cursor:not-allowed; }
  .alert-box { border-radius:10px; padding:12px 14px; font-size:13px; margin-top:12px; }
  .alert-success { background:var(--success-light); color:var(--success); }

  /* BOTTOM NAV */
  .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--gray-200); display:flex; z-index:200; padding:6px 0 10px; max-width:600px; margin:0 auto; }
  .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; color:var(--gray-500); text-decoration:none; padding:4px 0; }
  .nav-item i { font-size:22px; }
  .nav-item.active { color:var(--primary); }

  .empty-state { text-align:center; padding:32px 20px; color:var(--gray-500); font-size:13px; }
  .empty-state i { font-size:36px; opacity:.3; display:block; margin-bottom:8px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <a href="index.html" style="display:inline-flex;align-items:center;gap:4px;color:#6b7280;font-size:13px;text-decoration:none;margin-bottom:16px;">
  <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
  Quay lại
</a>
    <div class="login-logo">🛠️</div>
    <div class="login-title">Trang Quản trị</div>
    <div class="login-sub">Dành cho Hành chính / Ban quản lý</div>
    <div id="loginAlert"></div>
    <label class="form-label-sm">Mật khẩu Admin</label>
    <input class="form-input" id="adminPassInput" type="password" placeholder="Nhập mật khẩu..." onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="btn-login" onclick="doLogin()">Đăng nhập</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" style="display:none">
  <div class="page-wrap">
    <div class="topbar">
      <div class="topbar-title">🛠️ Quản trị thư viện</div>
      <button class="btn-logout" onclick="doLogout()"><i class="bi bi-box-arrow-right"></i> Thoát</button>
    </div>

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Đang mượn</div>
        <div class="stat-value" id="statBorrowing">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Chờ xác nhận</div>
        <div class="stat-value" id="statWaiting">—</div>
      </div>
    </div>

    <!-- DANH SÁCH ĐANG MƯỢN -->
    <div class="section-title">📋 Danh sách đang mượn &amp; chờ xác nhận</div>
    <div id="borrowList"></div>

    <!-- FORM VIẾT REVIEW -->
    <div class="section-title">📝 Đăng review mới</div>
    <div class="review-form-wrap">
      <label class="form-label-sm">Chọn sách *</label>
      <select class="form-select" id="reviewMaSach" onchange="onBookSelect()">
        <option value="">-- Chọn sách --</option>
      </select>
      <label class="form-label-sm">Tiêu đề bài review *</label>
      <input class="form-input" id="reviewTieuDe" placeholder="Ví dụ: Cuốn sách thay đổi góc nhìn của tôi..."/>
      <label class="form-label-sm">Nội dung chi tiết *</label>
      <textarea class="form-textarea" id="reviewNoiDung" placeholder="Chia sẻ cảm nhận, điều thú vị bạn học được từ cuốn sách này..."></textarea>
      <label class="form-label-sm">Người viết</label>
      <input class="form-input" id="reviewNguoiViet" placeholder="Tên hoặc bộ phận (mặc định: Admin)"/>
      <button class="btn-submit" id="btnAddReview" onclick="submitReview()">Đăng review</button>
      <div id="reviewAlert"></div>
    </div>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav" style="display:none">
  <a class="nav-item" href="index.html">
    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>Sách</span>
  </a>
  <a class="nav-item" href="review.html">
    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    <span>Review</span>
  </a>
  <a class="nav-item active" href="admin.html">
    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Cài đặt</span>
  </a>
</nav>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbzS84k6tXSESeSb5x1vmh1IkEbbupuFlJ7NYVyq4eLDKRePrTI7Q1vhQalayQUgepsQ/exec';
var adminPass = '';
var borrowedData = [];
var allBooks = [];

// ---- LOGIN ----
function doLogin() {
  var pass = document.getElementById('adminPassInput').value.trim();
  if (!pass) return;
  adminPass = pass;
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
  document.getElementById('bottomNav').style.display = 'flex';
  loadAdminData();
}
function doLogout() {
  adminPass = '';
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('bottomNav').style.display = 'none';
  document.getElementById('adminPassInput').value = '';
}

// ---- LOAD DATA ----
async function loadAdminData() {
  loadBorrowList();
  loadBookOptions();
}

async function loadBorrowList() {
  document.getElementById('borrowList').innerHTML = '<div class="empty-state"><div class="spinner-border spinner-border-sm text-primary"></div></div>';
  try {
    var res = await fetch(API_URL + '?action=getBorrowed');
    var json = await res.json();
    if (!json.success) { document.getElementById('borrowList').innerHTML = '<div class="empty-state">Lỗi tải dữ liệu.</div>'; return; }
    borrowedData = json.data;
    var borrowing = json.data.filter(function(x){ return x.trangThai === 'Đang mượn'; });
    var waiting = json.data.filter(function(x){ return x.trangThai === 'Chờ xác nhận'; });
    document.getElementById('statBorrowing').textContent = borrowing.length;
    document.getElementById('statWaiting').textContent = waiting.length;
    if (json.data.length === 0) {
      document.getElementById('borrowList').innerHTML = '<div class="empty-state"><i class="bi bi-check-circle"></i>Không có sách nào đang mượn.</div>';
      return;
    }
    // Sort: cho xac nhan len truoc
    var sorted = waiting.concat(borrowing);
    var html = sorted.map(function(item) {
      var isWaiting = item.trangThai === 'Chờ xác nhận';
      var pillClass = isWaiting ? 'status-waiting' : 'status-borrowing';
      var confirmBtn = isWaiting
        ? '<button class="btn-confirm" onclick="confirmReturn(\'' + item.idGiaoDich + '\')">✓ Xác nhận đã trả</button>'
        : '';
      return '<div class="borrow-row" id="row-' + item.idGiaoDich + '">'
        + '<div class="borrow-info">'
        + '<div class="borrow-book">' + escHtml(item.tenSach) + '</div>'
        + '<div class="borrow-person">' + escHtml(item.hoTen) + ' · ' + escHtml(item.maNhanVien) + '</div>'
        + '<div class="borrow-date">Mượn: ' + item.ngayMuon + (item.ngayTra ? ' · Trả: ' + item.ngayTra : '') + '</div>'
        + confirmBtn
        + '</div>'
        + '<span class="status-pill ' + pillClass + '">' + item.trangThai + '</span>'
        + '</div>';
    }).join('');
    document.getElementById('borrowList').innerHTML = html;
  } catch(e) {
    document.getElementById('borrowList').innerHTML = '<div class="empty-state">Lỗi kết nối.</div>';
  }
}

async function confirmReturn(idGiaoDich) {
  if (!confirm('Xác nhận đã nhận lại sách?')) return;
  try {
    var res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'confirmReturn', idGiaoDich: idGiaoDich, adminPass: adminPass })
    });
    var json = await res.json();
    if (json.success) {
      var row = document.getElementById('row-' + idGiaoDich);
      if (row) {
        row.style.opacity = '.4';
        row.innerHTML = '<div style="padding:4px;font-size:13px;color:var(--success)">✓ Đã xác nhận trả sách</div>';
        setTimeout(function(){ row.remove(); loadBorrowList(); }, 1500);
      }
    } else {
      alert('Lỗi: ' + json.error);
    }
  } catch(e) { alert('Lỗi kết nối.'); }
}

// ---- BOOK OPTIONS ----
async function loadBookOptions() {
  try {
    var res = await fetch(API_URL + '?action=getBooks');
    var json = await res.json();
    if (!json.success) return;
    allBooks = json.data;
    var sel = document.getElementById('reviewMaSach');
    json.data.forEach(function(b) {
      var opt = document.createElement('option');
      opt.value = b.maSach;
      opt.textContent = b.tenSach + ' — ' + b.tacGia;
      opt.dataset.ten = b.tenSach;
      sel.appendChild(opt);
    });
  } catch(e) {}
}

var selectedTenSach = '';
function onBookSelect() {
  var sel = document.getElementById('reviewMaSach');
  var opt = sel.options[sel.selectedIndex];
  selectedTenSach = opt ? opt.dataset.ten || '' : '';
}

// ---- SUBMIT REVIEW ----
async function submitReview() {
  var maSach = document.getElementById('reviewMaSach').value;
  var tieuDe = document.getElementById('reviewTieuDe').value.trim();
  var noiDung = document.getElementById('reviewNoiDung').value.trim();
  var nguoiViet = document.getElementById('reviewNguoiViet').value.trim() || 'Admin';

  if (!maSach || !tieuDe || !noiDung) {
    setAlert('reviewAlert', 'error', 'Vui lòng điền đầy đủ: Sách, Tiêu đề và Nội dung.');
    return;
  }
  var btn = document.getElementById('btnAddReview');
  btn.disabled = true; btn.textContent = 'Đang đăng...';

  try {
    var res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'addReview', maSach: maSach, tenSach: selectedTenSach, tieuDe: tieuDe, noiDung: noiDung, nguoiViet: nguoiViet, adminPass: adminPass })
    });
    var json = await res.json();
    if (json.success) {
      setAlert('reviewAlert', 'success', '✓ ' + json.message);
      document.getElementById('reviewMaSach').value = '';
      document.getElementById('reviewTieuDe').value = '';
      document.getElementById('reviewNoiDung').value = '';
      document.getElementById('reviewNguoiViet').value = '';
    } else {
      setAlert('reviewAlert', 'error', json.error);
    }
  } catch(e) { setAlert('reviewAlert', 'error', 'Lỗi kết nối.'); }
  btn.disabled = false; btn.textContent = 'Đăng review';
}

function setAlert(id, type, msg) {
  var cls = type === 'success' ? 'alert-success alert-box' : 'alert-box' ;
  if(type !== 'success') cls = 'alert-box'; 
  document.getElementById(id).innerHTML = '<div class="' + cls + (type==='error'?' alert-error':'') + '">' + msg + '</div>';
}
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
